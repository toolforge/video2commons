[project]
name = "video2commons"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["ruff>=0.17.1"]

[tool.ruff.lint]
# Ruff's default rules, plus the pycodestyle and pyflakes rules that it no
# longer enables by default since 0.16.
extend-select = ["E4", "E7", "E9", "F"]
ignore = ["E722"]

[tool.ruff.lint.per-file-ignores]
# Pywikibot looks for a file with this exact name.
"**/user-config.py" = ["N999"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true
