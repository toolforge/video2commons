[project]
name = "video2commons"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["ruff>=0.17.1"]

[tool.ruff.lint]
# Ruff 0.16 enables far more rules by default (413 instead of 59). Keep the
# rule set used so far; new rules can be adopted one by one.
select = ["E4", "E7", "E9", "F"]
extend-select = ["UP004", "UP008", "UP024", "UP034", "PIE790", "RET501", "FURB167", "UP017", "UP006", "UP035", "UP045", "UP032", "I001", "PERF102", "C402", "RUF046", "RUF059", "SIM102", "B006"]
ignore = ["E722"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true
