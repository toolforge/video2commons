{% extends "base.min.html" %}

{% block content %}
  {% if token %}
    <div class="alert alert-success" id="connect-done" hidden>
      {{ _('connectDone') }}
    </div>
    <div class="alert alert-danger" id="connect-no-opener" hidden>
      {{ _('connectNoOpener') }}
    </div>
    <script>
      (function () {
        // The token goes to the page that opened this popup, and only if that
        // page is still on the origin it asked for.
        if (window.opener) {
          window.opener.postMessage(
            {
              type: "video2commons-token",
              token: {{ token|tojson }},
              username: {{ username|tojson }}
            },
            {{ origin|tojson }}
          );
          document.getElementById("connect-done").hidden = false;
          window.close();
        } else {
          document.getElementById("connect-no-opener").hidden = false;
        }
      })();
    </script>
  {% else %}
    <h1 class="h3 mt-3">{{ _('connectTitle') }}</h1>
    <p class="lead">
      {{ _('connectQuestion')|replace('$1', origin)|replace('$2', username) }}
    </p>
    <div class="alert alert-danger" id="connect-no-opener" hidden>
      {{ _('connectNoOpener') }}
    </div>
    <form id="connect-form" method="post" action="{{ url_for('connect') }}">
      <input type="hidden" name="origin" value="{{ origin }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf }}">
      <button class="btn btn-primary" type="submit">{{ _('connectAllow') }}</button>
      <button class="btn" type="button" onclick="window.close()">{{ _('connectCancel') }}</button>
    </form>
    <script>
      // Without the window that asked, a token would have nowhere to go.
      if (!window.opener) {
        document.getElementById("connect-form").hidden = true;
        document.getElementById("connect-no-opener").hidden = false;
      }
    </script>
  {% endif %}
{% endblock %}
